[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sahirfq"
version = "0.1.0"
description = "Evidence-first RFQ readiness, constrained sourcing and grounded catalog QA"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "scikit-learn>=1.5,<2"]

[tool.setuptools]
packages = ["sahirfq"]
